# https://taskfile.dev
version: '3'

tasks:
  setup:
    summary: Install the latest stable M-Press CLI with embedded D2
    cmds:
      - go install github.com/leaanthony/mpress/cmd/mpress@latest

  dev:
    summary: Preview the Wails v3 documentation
    dir: ..
    cmds:
      - mpress dev

  build:
    summary: Build and validate the Wails v3 documentation
    dir: ..
    cmds:
      - python3 docs/mpress/scripts/check_translations.py
      - mpress build --strict --no-purge-css
      - mpress check
      - python3 docs/mpress/scripts/check_site.py docs/mpress/site
