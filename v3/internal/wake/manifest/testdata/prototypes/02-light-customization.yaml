# yaml-language-server: $schema=https://v3.wails.io/schemas/wails.v3.json
version: 3
project:
  name: ledger
  product_name: Ledger
  identifier: io.acme.ledger
  version: 1.4.0
  company: Acme Ltd
  binary_name: ledger
  icon: assets/appicon.png
frontend:
  directory: frontend
  install: [pnpm, install, --frozen-lockfile]
  build: [./scripts/build-frontend]
  dev: [pnpm, run, dev]
  output: frontend/dist
  environment:
    PUBLIC_EDITION: community
build:
  output: dist
  tags: [sqlite_fts5]
dev:
  debounce_ms: 500
  log_level: info
  watch: ['**/*.go', frontend/src/**]
  exclude: [dist/**, frontend/node_modules/**]
  use_git_ignore: true
targets:
  windows/amd64:
    toolchain: zig
    tags: [enterprise]
packages:
  nsis:
    install_scope: user
profiles:
  release:
    targets:
      windows/amd64:
        formats: [nsis]
