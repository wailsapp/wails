<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: transparent;
            color: #1d1d1f;
            -webkit-user-select: none;
            user-select: none;
        }
        body {
            display: flex;
            flex-direction: column;
            padding-top: 50px; /* room for the invisible title bar / toolbar */
        }
        .toolbar-hint {
            text-align: center;
            font-size: 12px;
            color: #8a8a8e;
            padding: 4px 0 12px;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 32px;
            min-height: 0;
        }
        .stats {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
            font-size: 12px;
            color: #6e6e73;
        }
        .chip {
            background: rgba(0, 0, 0, 0.06);
            border-radius: 100px;
            padding: 3px 10px;
        }
        #editor, #preview {
            flex: 1;
            min-height: 220px;
            -webkit-user-select: text;
            user-select: text;
        }
        #editor {
            width: 100%;
            resize: none;
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 16px;
            font: 15px/1.6 -apple-system, sans-serif;
            background: rgba(255, 255, 255, 0.6);
        }
        #preview {
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.6);
            overflow-y: auto;
            line-height: 1.6;
        }
        #preview mark {
            background: #ffe08a;
            border-radius: 3px;
        }
        .hidden { display: none !important; }
        #activity {
            margin: 16px 0 24px;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            padding-top: 10px;
        }
        #activity h2 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #8a8a8e;
            margin: 0 0 8px;
        }
        #activity-log {
            list-style: none;
            margin: 0;
            padding: 0;
            max-height: 110px;
            overflow-y: auto;
            font: 12px/1.7 ui-monospace, SFMono-Regular, monospace;
            color: #48484a;
        }
        #activity-log li:first-child { color: #1d1d1f; font-weight: 600; }
    </style>
</head>
<body>
    <p class="toolbar-hint">The Edit/Preview segment, search field, Share and Info buttons above are real NSToolbarItems, not part of this page.</p>

    <main>
        <div class="stats">
            <span class="chip" id="mode-chip">Mode: edit</span>
            <span class="chip" id="info-chip">Info clicks: 0</span>
        </div>

        <textarea id="editor" spellcheck="false"># Weekend plan

**Saturday**: farmers market, then fix the bike.
**Sunday**: long walk, read a chapter, call home.

Search for "walk" using the toolbar search field to see it highlighted below in Preview mode.</textarea>
        <div id="preview" class="hidden"></div>

        <div id="activity">
            <h2>Activity log (native toolbar &rarr; Go &rarr; frontend)</h2>
            <ul id="activity-log"><li>Waiting for a toolbar interaction&hellip;</li></ul>
        </div>
    </main>

    <script type="module">
        import { Events } from '/wails/runtime.js';

        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const modeChip = document.getElementById('mode-chip');
        const infoChip = document.getElementById('info-chip');
        const log = document.getElementById('activity-log');

        let mode = 'edit';
        let lastQuery = '';

        function escapeHtml(s) {
            return s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
        }

        function renderMarkdownLite(text, query) {
            let html = escapeHtml(text)
                .replace(/^# (.+)$/gm, '<h2>$1</h2>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>');
            if (query) {
                const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                html = html.replace(new RegExp('(' + escaped + ')', 'ig'), '<mark>$1</mark>');
            }
            return html;
        }

        function renderPreview() {
            preview.innerHTML = renderMarkdownLite(editor.value, lastQuery);
        }

        function logLine(text) {
            const li = document.createElement('li');
            li.textContent = text;
            log.prepend(li);
            while (log.children.length > 30) log.removeChild(log.lastChild);
        }

        Events.On('view:mode', (event) => {
            mode = event.data;
            modeChip.textContent = 'Mode: ' + mode;
            if (mode === 'preview') {
                renderPreview();
                editor.classList.add('hidden');
                preview.classList.remove('hidden');
            } else {
                editor.classList.remove('hidden');
                preview.classList.add('hidden');
            }
            logLine('view: switched to ' + mode);
        });

        Events.On('toolbar:search', (event) => {
            lastQuery = event.data ?? '';
            const matches = lastQuery
                ? (editor.value.match(new RegExp(lastQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'ig')) ?? []).length
                : 0;
            if (mode === 'preview') renderPreview();
            logLine(lastQuery ? `search: "${lastQuery}" -> ${matches} match(es)` : 'search: cleared');
        });

        Events.On('toolbar:action', (event) => {
            const { action, count } = event.data;
            if (action === 'share') {
                logLine('share: note content shared');
            } else if (action === 'info') {
                infoChip.textContent = 'Info clicks: ' + count;
                logLine(`info: clicked (badge now ${count})`);
            }
        });
    </script>
</body>
</html>
