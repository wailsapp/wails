<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebviewPanel Demo</title>
<style>
* { box-sizing:border-box; }
body { margin:0; height:100vh; display:flex; flex-direction:column; gap:20px; padding:24px; background:#1a1a2e; color:#eef2ff; font:16px system-ui,sans-serif; }
header { display:flex; align-items:center; justify-content:space-between; gap:20px; flex-wrap:wrap; }
h1 { font-size:24px; margin:0 0 6px; }
p { margin:0; color:#b8c2df; }
nav { display:flex; gap:8px; flex-wrap:wrap; }
button { padding:10px 16px; border:1px solid #576182; border-radius:8px; background:#222c46; color:inherit; cursor:pointer; }
button.active { background:#e94560; border-color:#e94560; }
button:focus-visible { outline:3px solid #a5b4fc; }
#panelContainer { flex:1; min-height:1px; border:1px solid #576182; background:#f8fafc; }
footer { display:flex; justify-content:space-between; gap:16px; color:#b8c2df; font-size:14px; }
#error { color:#fda4af; }
</style>
</head>
<body>
<header>
<div><h1>WebviewPanel Demo</h1><p>A native browser embedded inside this window</p></div>
<nav aria-label="Panel destination">
<button data-site="local" class="active">Local page</button>
<button data-site="wails">Wails.io</button>
<button data-site="google">Google</button>
<button id="toggle" disabled>Hide panel</button>
</nav>
</header>
<div id="panelContainer" aria-label="Embedded browser"></div>
<p id="error" role="alert" hidden></p>
<footer><span>Resize the window to keep the panel aligned.</span><span id="sizeInfo"></span></footer>
<script type="module">
import {Call, Panel} from '/wails/runtime.js';
import {createLayoutScheduler} from './layout.mjs';
const panel = Panel.Get('embedded-content');
const container = document.getElementById('panelContainer');
const error = document.getElementById('error');
let visible = true;
let initialLayout = true;
function report(err) { error.textContent = String(err); error.hidden = false; }
async function layout() {
    const rect = container.getBoundingClientRect();
    const bounds = {x:Math.round(rect.left+1),y:Math.round(rect.top+1),width:Math.max(1,Math.round(rect.width-2)),height:Math.max(1,Math.round(rect.height-2))};
    await panel.SetBounds(bounds);
    document.getElementById('sizeInfo').textContent = `${bounds.width} × ${bounds.height} px`;
    if (initialLayout) {
        await panel.Show();
        initialLayout = false;
        document.getElementById('toggle').disabled = false;
    }
}
const scheduleLayout = createLayoutScheduler(layout, report);
new ResizeObserver(scheduleLayout).observe(container);
window.addEventListener('resize',scheduleLayout);
scheduleLayout();
for (const button of document.querySelectorAll('[data-site]')) {
    button.addEventListener('click',async () => {
        const destinations = document.querySelectorAll('[data-site]');
        for (const item of destinations) item.disabled = true;
        try {
            await Call.ByName('main.App.SwitchPanel',button.dataset.site);
            for (const item of destinations) item.classList.toggle('active',item===button);
            error.hidden = true;
        } catch (err) { report(err); }
        finally { for (const item of destinations) item.disabled = false; }
    });
}
document.getElementById('toggle').addEventListener('click',async event => {
    const button = event.currentTarget;
    button.disabled = true;
    try {
        if (visible) await panel.Hide(); else await panel.Show();
        visible = !visible;
        button.textContent = visible ? 'Hide panel' : 'Show panel';
    } catch (err) { report(err); }
    finally { button.disabled = false; }
});
</script>
</body>
</html>
