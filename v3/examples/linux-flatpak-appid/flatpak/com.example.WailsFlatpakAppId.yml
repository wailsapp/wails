app-id: com.example.WailsFlatpakAppId
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
command: wails-flatpak-appid

# Deliberately minimal. Nothing here is unusual, and no permission a manifest
# can grant makes the app id and the GtkApplication id agree.
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri

  # Uncomment to work around the crash by granting the derived name up front.
  # It only works because the name is known here by having read the panic; it
  # is not something a manifest author can look up.
  # - --a11y-own-name=org.wails.linux-flatpak-appid.*

modules:
  - name: wails-flatpak-appid
    buildsystem: simple
    build-commands:
      - install -D wails-flatpak-appid /app/bin/wails-flatpak-appid
      - install -Dm644 com.example.WailsFlatpakAppId.desktop
        /app/share/applications/com.example.WailsFlatpakAppId.desktop
      # The desktop entry needs a matching icon or the shell has nothing to draw
      # in the menu, which is where this has to be launched from to reproduce.
      - install -Dm644 com.example.WailsFlatpakAppId.png
        /app/share/icons/hicolor/128x128/apps/com.example.WailsFlatpakAppId.png
    sources:
      - type: file
        path: wails-flatpak-appid
      - type: file
        path: com.example.WailsFlatpakAppId.desktop
      - type: file
        path: com.example.WailsFlatpakAppId.png
