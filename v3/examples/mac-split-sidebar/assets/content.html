<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Content</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #ffffff;
            color: #1d1d1f;
            -webkit-user-select: text;
            user-select: text;
        }
        body { padding: 28px 40px; overflow-y: auto; }
        h1 { font-size: 22px; margin: 0 0 6px; }
        .byline { font-size: 12px; color: #8a8a8e; margin-bottom: 20px; }
        p { font-size: 14px; line-height: 1.7; max-width: 62ch; }
    </style>
</head>
<body>
    <h1 id="title">&nbsp;</h1>
    <div class="byline" id="byline">&nbsp;</div>
    <p id="body"></p>

    <script type="module">
        import { Events } from '/wails/runtime.js';

        const ARTICLES = {
            a1: {
                title: 'Native panes, not positioned webviews',
                author: 'M. Reyes', date: '2026-07-18',
                body: 'A WebviewPanel places one webview at an x/y offset on top of another, which is the right tool for a floating overlay. It is not the same mechanism as this: three independent NSSplitViewItems, each hosting its own WKWebView, arranged by a real NSSplitViewController with a draggable divider, standard AppKit collapse behaviour, and automatic vibrancy for the sidebar and inspector roles.',
            },
            a2: {
                title: 'Why sidebars get glass for free',
                author: 'J. Okafor', date: '2026-07-21',
                body: 'NSSplitViewItem has a dedicated +sidebarWithViewController: factory. It sets a translucent material background, sane min/max thickness, spring-loading and collapsibility as defaults for that one call, all before this app overrides any of them. Nothing about the material is hand-rolled here.',
            },
            a3: {
                title: 'Divider autosave, explained',
                author: 'S. Kowalski', date: '2026-07-25',
                body: 'AutosaveName on MacSplitWindowOptions is passed straight through to NSSplitView.autosaveName, which persists divider positions to NSUserDefaults keyed by that name. Drag a divider, quit, relaunch: it comes back where you left it, with no extra code in this example.',
            },
        };

        const titleEl = document.getElementById('title');
        const bylineEl = document.getElementById('byline');
        const bodyEl = document.getElementById('body');

        Events.On('reader:select', (event) => {
            const article = ARTICLES[event.data];
            if (!article) return;
            titleEl.textContent = article.title;
            bylineEl.textContent = article.author + ' · ' + article.date;
            bodyEl.textContent = article.body;
        });
    </script>
</body>
</html>
