<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sidebar</title>
    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: transparent; /* let the sidebar's own NSVisualEffectView glass show through */
            color: #1d1d1f;
            -webkit-user-select: none;
            user-select: none;
        }
        body { padding: 12px 8px; }
        h1 {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #6e6e73;
            margin: 8px 8px 10px;
        }
        ul { list-style: none; margin: 0; padding: 0; }
        li {
            padding: 8px 10px;
            border-radius: 6px;
            cursor: default;
            font-size: 13px;
            line-height: 1.4;
            margin-bottom: 2px;
        }
        li:hover { background: rgba(0, 0, 0, 0.05); }
        li.selected { background: #0a84ff; color: white; }
    </style>
</head>
<body>
    <h1>Articles</h1>
    <ul id="list"></ul>

    <script type="module">
        import { Events } from '/wails/runtime.js';

        const ARTICLES = [
            { id: 'a1', title: 'Native panes, not positioned webviews' },
            { id: 'a2', title: 'Why sidebars get glass for free' },
            { id: 'a3', title: 'Divider autosave, explained' },
        ];

        const list = document.getElementById('list');

        function render(selectedID) {
            list.innerHTML = '';
            for (const article of ARTICLES) {
                const li = document.createElement('li');
                li.textContent = article.title;
                if (article.id === selectedID) li.classList.add('selected');
                li.addEventListener('click', () => {
                    Events.Emit('reader:select', article.id);
                });
                list.appendChild(li);
            }
        }

        Events.On('reader:select', (event) => render(event.data));

        render('a1');
        Events.Emit('reader:select', 'a1'); // select the first article on launch
    </script>
</body>
</html>
