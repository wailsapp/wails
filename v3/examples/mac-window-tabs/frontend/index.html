<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/wails.png"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link rel="stylesheet" href="/style.css"/>
    <title>Wails App</title>
</head>
<body>
<div class="container">
    <div>
        <a data-wml-openURL="https://wails.io">
            <img src="/wails.png" class="logo" alt="Wails logo"/>
        </a>
        <a data-wml-openURL="https://developer.mozilla.org/en-US/docs/Web/JavaScript">
            <img src="/javascript.svg" class="logo vanilla" alt="JavaScript logo"/>
        </a>
    </div>
    <h1>macOS Window Tabs</h1>
    <div class="card">
        <div class="result">Open new windows from Go bindings</div>
        <div class="input-box">
            <a href="#" class="btn" onclick="openTabbedWindow(); return false;">Open tabbed window</a>
            <a href="#" class="btn" onclick="openNonTabbedWindow(); return false;">Open non-tabbed window</a>
        </div>
        <div class="input-box">
            <a href="#" class="btn" onclick="addTab(); return false;">Add tab via AddTab</a>
            <a href="#" class="btn" onclick="detachTab(); return false;">Detach this tab</a>
            <a href="#" class="btn" onclick="tabSummary(); return false;">Describe tab group</a>
        </div>
        <div class="result" id="summary">The Tabs menu drives the tab group API for the key window.</div>
    </div>
    <div class="footer">
        <div><p>Click on the Wails logo to learn more</p></div>
        <div><p id="time">Listening for Time event...</p></div>
    </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
