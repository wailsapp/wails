# https://taskfile.dev

version: "3"

tasks:
  install:
    desc: Install Dependencies
    aliases: [i]
    cmds:
      - corepack enable
      - corepack prepare pnpm@10.34.7 --activate
      - pnpm install
    sources:
      - package.json
      - pnpm-lock.yaml

  default:
    desc: Start Website
    deps: [install]
    aliases: [s, start]
    cmds:
      - npx docusaurus start

  build:
    desc: Build Website
    deps: [install]
    cmds:
      - npx docusaurus build

  preview:
    desc: Preview Website
    deps: [build]
    aliases: [serve]
    cmds:
      - npx docusaurus serve

  format:md:
    cmds:
      - npx prettier --write "**/*.{md,mdx}"

  format:
    cmds:
      - task: format:md
