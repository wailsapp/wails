name: Release v3
run-name: Release v3 ${{ inputs.tag || github.ref_name }} (${{ inputs.orchestrator_run || 'direct' }})

on:
  push:
    tags:
      - 'v3.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build (e.g. v3.0.0-test.1) — must already exist in the repo'
        required: true
        type: string
      pre_release:
        description: 'Mark as pre-release on GitHub'
        required: false
        default: true
        type: boolean
      draft:
        description: 'Create the release as a draft (use this to rehearse the release without publishing anything)'
        required: false
        default: false
        type: boolean
      release_notes:
        description: 'Optional curated release notes supplied by the release orchestrator'
        required: false
        type: string
      orchestrator_run:
        description: 'Optional caller run identifier used to track this workflow'
        required: false
        type: string

env:
  GO_VERSION: '1.25'

# Default the GITHUB_TOKEN to read-only for all jobs; the release job opts up to
# contents: write where it actually needs it.
permissions:
  contents: read

jobs:
  # ── Preflight: fail in seconds, not ten minutes into a build ─────────────────
  #
  # This catches a version mismatch before a multi-platform build. The version
  # file is embedded into the CLI, so a mismatch would publish a binary that
  # misreports its version.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      pre_release: ${{ steps.meta.outputs.pre_release }}
    steps:
      - name: Resolve tag and pre-release flag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
            PRE="${{ inputs.pre_release }}"
          else
            TAG="${{ github.ref_name }}"
            # Tags with a hyphen suffix (v3.0.0-beta.1) are pre-releases.
            if [[ "$TAG" == *"-"* ]]; then PRE=true; else PRE=false; fi
          fi
          echo "tag=$TAG"         >> "$GITHUB_OUTPUT"
          echo "pre_release=$PRE" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG (pre-release: $PRE)"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Version file agrees with the tag
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          FILE_VERSION="$(tr -d '[:space:]' < v3/internal/version/version.txt)"
          # version.txt is embedded into the binary, so it is what `wails3
          # version` reports. If it disagrees with the tag, the release ships a
          # binary that lies about which version it is, silently.
          if [[ "$FILE_VERSION" != "$TAG" ]]; then
            echo "::error::v3/internal/version/version.txt says '$FILE_VERSION' but the tag is '$TAG'."
            echo "::error::The tagged commit must carry the matching version. Re-tag after bumping it."
            exit 1
          fi
          echo "version.txt matches the tag: $FILE_VERSION"

  # ── Linux binaries (native runners, CGO_ENABLED=0 for static binaries) ──────
  build-linux:
    name: Build Linux / ${{ matrix.arch }}
    needs: preflight
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          # Preflight resolved the tag for both trigger paths and proved it
          # exists, so every job builds the same, verified source.
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: v3/go.sum

      - name: Build
        working-directory: v3
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: |
          go build \
            -ldflags="-s -w" \
            -trimpath \
            -o wails3-linux-${{ matrix.arch }} \
            ./cmd/wails3

      - uses: actions/upload-artifact@v4
        with:
          name: wails3-linux-${{ matrix.arch }}
          path: v3/wails3-linux-${{ matrix.arch }}
          retention-days: 1

  # ── Windows binary ────────────────────────────────────────────────────────────
  build-windows:
    name: Build Windows / amd64
    needs: preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Preflight resolved the tag for both trigger paths and proved it
          # exists, so every job builds the same, verified source.
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: v3/go.sum

      - name: Build
        working-directory: v3
        env:
          CGO_ENABLED: 0
          GOOS: windows
          GOARCH: amd64
        run: go build -ldflags="-s -w" -trimpath -o wails3-windows-amd64.exe ./cmd/wails3

      - uses: actions/upload-artifact@v4
        with:
          name: wails3-windows-amd64
          path: v3/wails3-windows-amd64.exe
          retention-days: 1

  # ── macOS: build amd64 + arm64 and create a universal binary ─────────────────
  build-sign-macos:
    name: Build macOS
    needs: preflight
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Preflight resolved the tag for both trigger paths and proved it
          # exists, so every job builds the same, verified source.
          ref: ${{ needs.preflight.outputs.tag }}

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: v3/go.sum

      - name: Build darwin/amd64
        working-directory: v3
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: go build -ldflags="-s -w" -trimpath -o wails3-darwin-amd64 ./cmd/wails3

      - name: Build darwin/arm64
        working-directory: v3
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
        run: go build -ldflags="-s -w" -trimpath -o wails3-darwin-arm64 ./cmd/wails3

      - name: Create universal binary
        working-directory: v3
        run: lipo -create -output wails3-darwin-universal wails3-darwin-amd64 wails3-darwin-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: wails3-macos
          path: |
            v3/wails3-darwin-amd64
            v3/wails3-darwin-arm64
            v3/wails3-darwin-universal
          retention-days: 1

  # ── Create GitHub Release and attach all binaries ────────────────────────────
  release:
    name: Publish Release
    needs: [preflight, build-linux, build-windows, build-sign-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write      # OIDC identity for the provenance attestation
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Generate checksums
        working-directory: dist
        run: |
          # Users have no way to verify a download without these, and generating
          # them anywhere other than the job that publishes the binaries defeats
          # the point.
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          # Signed statement of which source, builder and workflow produced each
          # binary. The npm package already ships provenance; the binaries
          # lagging behind it is an inconsistency users can see.
          subject-path: 'dist/wails3-*'

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.preflight.outputs.tag }}
          PRE: ${{ needs.preflight.outputs.pre_release }}
          DRAFT: ${{ inputs.draft }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          FLAGS=(
            --repo "${{ github.repository }}"
            --title "Wails $TAG"
          )
          if [ -n "$RELEASE_NOTES" ]; then
            FLAGS+=(--notes "$RELEASE_NOTES")
          else
            FLAGS+=(--generate-notes)
          fi
          [[ "$PRE" == "true" ]] && FLAGS+=(--prerelease)
          # A draft release is visible only to maintainers and can be deleted,
          # which is what makes rehearsing the whole path possible without
          # publishing anything.
          [[ "$DRAFT" == "true" ]] && FLAGS+=(--draft)

          # Fail fast if the tag does not exist. Otherwise `gh release create`
          # would create the tag at an arbitrary commit and publish a release
          # for the wrong source (notably on a workflow_dispatch typo).
          if ! gh api "repos/${{ github.repository }}/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG does not exist in ${{ github.repository }}; refusing to create a release."
            exit 1
          fi

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            # Release exists (e.g. workflow_dispatch re-run) — just upload binaries
            gh release upload "$TAG" dist/* \
              --repo "${{ github.repository }}" \
              --clobber
          else
            gh release create "$TAG" dist/* "${FLAGS[@]}"
          fi
