on:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to scan
        required: true
        type: string
    secrets:
      SEMGREP_APP_TOKEN:
        required: false
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches:
    - master
    paths:
    - .github/workflows/semgrep.yml
name: Semgrep
permissions:
  contents: read
jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-24.04
    env:
      SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
    container:
      image: returntocorp/semgrep
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.ref || github.sha }}
    - run: semgrep ci
