name: Build + Test v3

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master

# A new push supersedes the previous run for the same PR. macOS runners are the
# scarce resource (shared org-wide), so stale runs must not hold them.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The workflow runs on every PR so that "v3 Build Results" always reports and
  # can be a required check. The test jobs only run when v3 changed; otherwise
  # they are skipped and the results job passes.
  changes:
    name: Detect v3 changes
    runs-on: ubuntu-latest
    if: github.event.pull_request.base.ref == 'master'
    outputs:
      v3: ${{ steps.diff.outputs.v3 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check for changes under v3/
        id: diff
        # The checked-out PR merge commit has the base branch as its first
        # parent, so this lists exactly what the PR changes. The diff runs
        # outside the condition so a git failure fails the step instead of
        # reading as "no v3 changes".
        run: |
          files="$(git diff --name-only HEAD^1 HEAD)"
          if grep -qE '^(v3/|\.github/workflows/build-and-test-v3\.yml$)' <<< "$files"; then
            echo "v3=true" >> "$GITHUB_OUTPUT"
          else
            echo "v3=false" >> "$GITHUB_OUTPUT"
          fi

  test_js:
    name: Run JS Tests
    needs: [changes]
    runs-on: ubuntu-latest
    if: needs.changes.outputs.v3 == 'true'
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache npm packages
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-runtime-${{ hashFiles('v3/internal/runtime/desktop/@wailsio/runtime/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-runtime-

      - name: Install dependencies
        working-directory: v3/internal/runtime/desktop/@wailsio/runtime
        run: |
          npm ci
          npx --yes esbuild@latest --version

      - name: Clean build artifacts
        working-directory: v3/internal/runtime/desktop/@wailsio/runtime
        run: npm run clean

      - name: Type-check runtime
        working-directory: v3
        run: task runtime:check

      - name: Test runtime
        working-directory: v3
        run: task runtime:test

      - name: Check that the bundled runtime builds
        working-directory: v3
        run: task runtime:build

      - name: Check that the npm package builds
        working-directory: v3/internal/runtime/desktop/@wailsio/runtime
        run: npm run build

      - name: Pack runtime for template tests
        working-directory: v3/internal/runtime/desktop/@wailsio/runtime
        run: npm pack

      - name: Store runtime build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: runtime-build-artifacts
          path: |
            v3/internal/runtime/desktop/@wailsio/runtime/dist/
            v3/internal/runtime/desktop/@wailsio/runtime/types/
            v3/internal/runtime/desktop/@wailsio/runtime/tsconfig.tsbuildinfo

      - name: Store runtime package
        uses: actions/upload-artifact@v4
        with:
          name: runtime-package
          path: v3/internal/runtime/desktop/@wailsio/runtime/*.tgz

  test_go:
    name: Run Go Tests v3
    needs: [test_js]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        go-version: [1.25]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install linux dependencies (GTK4 default)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Drop the runner image's unused Microsoft apt repos (no-op off GitHub-hosted runners).
          ./.github/scripts/prune-runner-apt-sources.sh
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev build-essential pkg-config xvfb x11-xserver-utils at-spi2-core xdg-desktop-portal-gtk

      - name: Install linux dependencies (GTK3 legacy)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            v3/go.sum

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Retrieve runtime build artifacts
        uses: actions/download-artifact@v4
        with:
          name: runtime-build-artifacts
          path: v3/internal/runtime/desktop/@wailsio/runtime/

      - name: Build Examples (GTK4 default)
        working-directory: v3
        run: |
          echo "Starting example compilation tests (GTK4 default)..."
          task test:examples
          echo "Example compilation tests (GTK4 default) completed successfully"

      - name: Build Examples (GTK3 legacy)
        if: matrix.os == 'ubuntu-latest'
        working-directory: v3
        run: |
          echo "Starting example compilation tests (GTK3 legacy)..."
          BUILD_TAGS=gtk3 task test:examples
          echo "Example compilation tests (GTK3 legacy) completed successfully"

      - name: Run tests (mac)
        if: matrix.os == 'macos-latest'
        env:
          CGO_LDFLAGS: -framework UniformTypeIdentifiers -mmacosx-version-min=10.13
        working-directory: v3
        run: go test -v -timeout 10m ./...

      - name: Run tests (windows)
        if: matrix.os == 'windows-latest'
        working-directory: v3
        run: go test -v -timeout 10m ./...

      - name: Run tests (ubuntu) - GTK4 default
        if: matrix.os == 'ubuntu-latest'
        working-directory: v3
        # Skip service tests that hang in CI due to GTK4 display requirements
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" go test -v -timeout 10m -skip "TestService" ./...

      - name: Run tests (ubuntu) - GTK3 legacy
        if: matrix.os == 'ubuntu-latest'
        working-directory: v3
        # Service lifecycle tests require a stable live GTK window/display and
        # are already covered by the platform-specific test suites.
        run: dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1024x768x24" go test -tags gtk3 -v -timeout 10m -skip "TestService" ./...

      - name: Build server mode for every target
        if: matrix.os == 'ubuntu-latest'
        working-directory: v3
        env:
          CGO_ENABLED: "0"
        # Server mode is pure Go on every platform, so it cross-compiles here
        # without a C toolchain. Mobile targets are included to catch platform
        # files that are missing their !server constraint.
        run: |
          for target in linux/amd64 darwin/arm64 windows/amd64 android/arm64 ios/arm64; do
            echo "server build: $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -tags server ./pkg/application
          done

      - name: Run tests (ubuntu) - server mode
        if: matrix.os == 'ubuntu-latest'
        working-directory: v3
        run: go test -tags server -v -timeout 10m ./pkg/application

      - name: Typecheck binding generator output
        working-directory: v3
        run: task generator:test:check

  cleanup:
    name: Cleanup build artifacts
    if: always()
    needs: [test_js, test_go, test_templates]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: geekyeggo/delete-artifact@v5
        with:
          name: |
            runtime-build-artifacts
            runtime-package
          failOnError: false

  test_templates:
    name: Test Templates
    needs: [test_js, test_go]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every template is built on Linux. Frontend tooling behaves the same on
      # each OS, so macOS and Windows only build a representative pair to cover
      # the native packaging path without exhausting the macOS runner pool.
      matrix:
        os: [ubuntu-latest]
        template:
          - vanilla
          - vanilla-js
          - react
          - react-js
          - vue
          - vue-js
          - svelte
          - svelte-js
        go-version: [1.25]
        include:
          - { os: windows-latest, template: vanilla, go-version: 1.25 }
          - { os: windows-latest, template: react, go-version: 1.25 }
          - { os: macos-latest, template: vanilla, go-version: 1.25 }
          - { os: macos-latest, template: react, go-version: 1.25 }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install linux dependencies (GTK4 default)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # Drop the runner image's unused Microsoft apt repos (no-op off GitHub-hosted runners).
          ./.github/scripts/prune-runner-apt-sources.sh
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev libwayland-dev build-essential pkg-config

      - name: Install linux dependencies (GTK3 legacy)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: |
            v3/go.sum

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Wails3 CLI
        working-directory: v3
        run: |
          task install
          wails3 doctor

      - name: Download runtime package
        uses: actions/download-artifact@v4
        with:
          name: runtime-package
          path: wails-runtime-temp

      - name: Generate template '${{ matrix.template }}' (GTK4 default)
        shell: bash
        run: |
          # Get absolute path - use pwd -W on Windows for native paths, pwd elsewhere
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            RUNTIME_TGZ="$(cd wails-runtime-temp && pwd -W)/$(ls wails-runtime-temp/*.tgz | xargs basename)"
          else
            RUNTIME_TGZ="$(cd wails-runtime-temp && pwd)/$(ls wails-runtime-temp/*.tgz | xargs basename)"
          fi
          mkdir -p ./test-${{ matrix.template }}
          cd ./test-${{ matrix.template }}
          wails3 init -n ${{ matrix.template }} -t ${{ matrix.template }}
          cd ${{ matrix.template }}/frontend
          # Replace @wailsio/runtime version with local tarball
          npm pkg set dependencies.@wailsio/runtime="file://$RUNTIME_TGZ"
          cd ..
          wails3 build

      # GTK3 legacy template builds are covered by the Go example compilation tests above.

  build_results:
    if: ${{ always() && github.event.pull_request.base.ref == 'master' }}
    runs-on: ubuntu-latest
    name: v3 Build Results
    permissions: {}
    needs: [changes, test_go, test_js, test_templates, test_mac_private_apis]
    steps:
      - run: |
          # A failed change check would skip every test job, so it must pass.
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Change detection did not succeed"
            exit 1
          fi
          go_result="${{ needs.test_go.result }}"
          js_result="${{ needs.test_js.result }}"
          templates_result="${{ needs.test_templates.result }}"
          mac_apis_result="${{ needs.test_mac_private_apis.result }}"
          
          if [[ $go_result == "success" || $go_result == "skipped" ]] && \
             [[ $js_result == "success" || $js_result == "skipped" ]] && \
             [[ $templates_result == "success" || $templates_result == "skipped" ]] && \
             [[ $mac_apis_result == "success" || $mac_apis_result == "skipped" ]]; then
            echo "All required jobs succeeded or were skipped"
            exit 0
          else
            echo "One or more required jobs failed"
            exit 1
          fi

  test_mac_private_apis:
    name: macOS API variants
    needs: [changes]
    if: needs.changes.outputs.v3 == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: v3/go.mod
          cache-dependency-path: v3/go.sum
      # The variants run sequentially in one job: each takes about a minute,
      # so separate jobs spent most of their time on setup and runner queueing.
      - name: Test native bridges, binary isolation, and application package
        working-directory: v3
        run: |
          failed=()
          for tags in "" private_mac_apis production production,private_mac_apis production,devtools production,devtools,private_mac_apis; do
            echo "::group::tags=${tags:-public}"
            go test -tags "$tags" ./pkg/application -count=1 || failed+=("${tags:-public}")
            echo "::endgroup::"
          done
          if (( ${#failed[@]} )); then
            echo "::error::Failed variants: ${failed[*]}"
            exit 1
          fi
