name: Nightly Release v3

on:
  schedule:
    - cron: '0 15 * * *'  # 3 PM UTC daily
  workflow_dispatch:
    inputs:
      force_release:
        description: 'Force release even if no changes detected'
        required: false
        default: false
        type: boolean
      dry_run:
        description: 'Run in dry-run mode (no actual release)'
        required: false
        default: true
        type: boolean

jobs:
  nightly-release:
    runs-on: ubuntu-latest
    if: github.repository == 'wailsapp/wails'
    env:
      GOWORK: "off"
    
    permissions:
      contents: write
      pull-requests: read
      actions: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        ref: master
        fetch-depth: 0
        token: ${{ secrets.WAILS_REPO_TOKEN || github.token }}
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
        cache: true
        cache-dependency-path: 'v3/go.sum'
    
    - name: Install Task
      uses: arduino/setup-task@v2
      with:
        version: 3.x
        repo-token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Git
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        
        # Configure git to use the token for authentication
        git config --global url."https://x-access-token:${{ secrets.WAILS_REPO_TOKEN || github.token }}@github.com/".insteadOf "https://github.com/"

    - name: Check for existing release tag
      id: check_tag
      run: |
        if git describe --tags --exact-match HEAD 2>/dev/null; then
          echo "has_tag=true" >> $GITHUB_OUTPUT
          echo "tag=$(git describe --tags --exact-match HEAD)" >> $GITHUB_OUTPUT
        else
          echo "has_tag=false" >> $GITHUB_OUTPUT
          echo "tag=" >> $GITHUB_OUTPUT
        fi

    - name: Check whether a tagged commit still needs publication
      id: publication_check
      if: steps.check_tag.outputs.has_tag == 'true'
      env:
        GH_TOKEN: ${{ secrets.WAILS_REPO_TOKEN || github.token }}
      run: |
        tag="${{ steps.check_tag.outputs.tag }}"
        if [[ "$tag" == v3.* ]] && ! gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
          echo "needs_recovery=true" >> "$GITHUB_OUTPUT"
          echo "Release $tag is missing; the desktop artifact workflow will be re-dispatched."
        else
          echo "needs_recovery=false" >> "$GITHUB_OUTPUT"
        fi
    
    - name: Check for unreleased changelog content
      id: changelog_check
      run: |
        echo "🔍 Checking UNRELEASED_CHANGELOG.md for content..."
        
        # Run the release script in check mode to see if there's content
        cd v3/tasks/release
        
        # Use the release script itself to check for content
        if go run release.go --check-only 2>/dev/null; then
          echo "has_unreleased_content=true" >> $GITHUB_OUTPUT
          echo "✅ Found unreleased changelog content"
        else
          echo "has_unreleased_content=false" >> $GITHUB_OUTPUT
          echo "ℹ️  No unreleased changelog content found"
        fi

    - name: Quick change detection and early exit
      id: quick_check
      run: |
        echo "🔍 Quick check for changes to determine if we should continue..."
        
        # Release bookkeeping can be committed after a tag is created. In
        # particular, the auto-changelog workflow may add an entry to
        # UNRELEASED_CHANGELOG.md after the release has already completed.
        # That is not a new release input and must not create another nightly
        # release on its own.
        if CURRENT_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null); then
          LATEST_TAG="$CURRENT_TAG"
          echo "Current commit has release tag: $LATEST_TAG"
        else
          # Only consider the active release series (alpha2/beta/rc): they
          # outrank legacy alpha tags, and explicit patterns avoid stray tags
          # such as v3.0.0-alpha.98-tui being selected as the baseline.
          LATEST_TAG=$(git tag --list "v3.0.0-alpha2.*" "v3.0.0-beta.*" "v3.0.0-rc.*" | sort -V | tail -1)
        fi

        if [ -z "$LATEST_TAG" ]; then
          echo "No previous release found; a release is eligible if changelog content exists."
          if [ "${{ steps.changelog_check.outputs.has_unreleased_content }}" == "true" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "should_continue=true" >> $GITHUB_OUTPUT
            echo "reason=Unreleased changelog content with no previous release" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "should_continue=false" >> $GITHUB_OUTPUT
            echo "reason=No previous release and no unreleased changelog content" >> $GITHUB_OUTPUT
          fi
        elif git diff --quiet "${LATEST_TAG}..HEAD" -- \
          . \
          ':(exclude)v3/internal/version/version.txt' \
          ':(exclude)v3/UNRELEASED_CHANGELOG.md' \
          ':(exclude)docs/src/content/docs/changelog.mdx' \
          ':(exclude)v3/internal/runtime/desktop/@wailsio/runtime/package.json' \
          ':(exclude)v3/internal/runtime/desktop/@wailsio/runtime/package-lock.json'; then
          echo "No release inputs changed since $LATEST_TAG; skipping release."
          echo "has_changes=false" >> $GITHUB_OUTPUT
          echo "should_continue=false" >> $GITHUB_OUTPUT
          echo "reason=Only release bookkeeping changed since $LATEST_TAG" >> $GITHUB_OUTPUT
        else
          CHANGE_COUNT=$(git rev-list "${LATEST_TAG}..HEAD" --count)
          echo "Found release inputs in $CHANGE_COUNT commits since $LATEST_TAG"
          echo "has_changes=true" >> $GITHUB_OUTPUT
          echo "should_continue=true" >> $GITHUB_OUTPUT
          echo "reason=Release inputs changed since $LATEST_TAG" >> $GITHUB_OUTPUT
        fi
    
    - name: Early exit - No changes detected
      if: |
        steps.quick_check.outputs.should_continue == 'false' && 
        steps.publication_check.outputs.needs_recovery != 'true' &&
        github.event.inputs.force_release != 'true'
      run: |
        echo "🛑 EARLY EXIT: ${{ steps.quick_check.outputs.reason }}"
        echo ""
        echo "ℹ️  No changes detected since last release and force_release is not enabled."
        echo "   Workflow will exit early to save resources."
        echo ""
        echo "   To force a release anyway, run this workflow with 'force_release=true'"
        echo ""
        echo "## 🛑 Early Exit Summary" >> $GITHUB_STEP_SUMMARY
        echo "**Reason:** ${{ steps.quick_check.outputs.reason }}" >> $GITHUB_STEP_SUMMARY
        echo "**Action:** Workflow exited early to save resources" >> $GITHUB_STEP_SUMMARY
        echo "**Force Release:** Set 'force_release=true' to override this behavior" >> $GITHUB_STEP_SUMMARY
        exit 0
    
    - name: Continue with release process
      if: |
        steps.quick_check.outputs.should_continue == 'true' || 
        github.event.inputs.force_release == 'true'
      run: |
        echo "✅ Proceeding with release process..."
        if [ "${{ github.event.inputs.force_release }}" == "true" ]; then
          echo "🔨 FORCE RELEASE: Overriding change detection"
        fi
    
    - name: Run release script
      id: release
      if: |
        steps.quick_check.outputs.should_continue == 'true' || 
        github.event.inputs.force_release == 'true'
      env:
        # Keep these DISTINCT: the release script validates WAILS_REPO_TOKEN
        # against the API before pushing anything and falls back to
        # GITHUB_TOKEN if the PAT is expired/revoked. Passing the same value
        # for both (as before) made the fallback meaningless and an expired
        # PAT produced a half-release: tag pushed, no GitHub release.
        WAILS_REPO_TOKEN: ${{ secrets.WAILS_REPO_TOKEN }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        cd v3/tasks/release
        ARGS=()
        if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
          ARGS+=(--dry-run)
        fi
        # Release v3 must create the GitHub release with its artifacts in the
        # same operation. Publishing here first makes the release immutable and
        # prevents the artifact workflow from uploading its outputs.
        ARGS+=(--defer-github-release)
        go run release.go "${ARGS[@]}"

    # Tags created with GITHUB_TOKEN do not emit a push event that can trigger
    # Release v3. Dispatch it explicitly; this workflow is the sole publisher
    # so the immutable release is created with its platform binaries,
    # checksums, and provenance already attached.
    - name: Build and publish release with desktop artifacts
      id: desktop_artifacts
      if: |
        github.event.inputs.dry_run != 'true' &&
        ((steps.release.outcome == 'success' && steps.release.outputs.release_dry_run != 'true') ||
        steps.publication_check.outputs.needs_recovery == 'true')
      env:
        GH_TOKEN: ${{ secrets.WAILS_REPO_TOKEN || github.token }}
        RELEASE_NOTES: ${{ steps.release.outputs.release_notes }}
      run: |
        tag="${{ steps.release.outputs.release_tag || steps.check_tag.outputs.tag }}"
        caller="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
        run_title="Release v3 $tag ($caller)"
        pre_release=false
        if [[ "$tag" == *-* ]]; then
          pre_release=true
        fi

        INPUTS=(
          -f tag="$tag"
          -f pre_release="$pre_release"
          -f draft=false
          -f orchestrator_run="$caller"
        )
        if [ -n "$RELEASE_NOTES" ]; then
          INPUTS+=(-f release_notes="$RELEASE_NOTES")
        fi

        gh workflow run release-v3.yml \
          --repo "${{ github.repository }}" \
          --ref master \
          "${INPUTS[@]}"
        echo "dispatched=true" >> "$GITHUB_OUTPUT"
        echo "Dispatched Release v3 to publish $tag with desktop artifacts"

        run_id=""
        for _ in $(seq 1 30); do
          run_id=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow release-v3.yml \
            --event workflow_dispatch \
            --limit 20 \
            --json databaseId,displayTitle \
            --jq ".[] | select(.displayTitle == \"$run_title\") | .databaseId" \
            | head -n 1)
          if [ -n "$run_id" ]; then
            break
          fi
          sleep 2
        done
        if [ -z "$run_id" ]; then
          echo "::error::Unable to identify the dispatched Release v3 run for $tag."
          exit 1
        fi

        echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
        echo "Waiting for Release v3 run $run_id"
        gh run watch "$run_id" --repo "${{ github.repository }}" --exit-status
        echo "published=true" >> "$GITHUB_OUTPUT"

    - name: Summary
      if: always()
      run: |
        if [ "${{ github.event.inputs.dry_run }}" == "true" ]; then
          echo "## 🧪 DRY RUN Release Summary" >> $GITHUB_STEP_SUMMARY
        else
          echo "## 🚀 Nightly Release Summary" >> $GITHUB_STEP_SUMMARY
        fi
        echo "================================" >> $GITHUB_STEP_SUMMARY

        if [ -n "${{ steps.release.outputs.release_version }}" ]; then
          echo "- **Version:** ${{ steps.release.outputs.release_version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag:** ${{ steps.release.outputs.release_tag }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ steps.release.outcome == 'success' && '✅ Success' || '⚠️ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode:** ${{ steps.release.outputs.release_dry_run == 'true' && '🧪 Dry Run' || '🚀 Live release' }}" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ steps.release.outputs.release_url }}" ]; then
            echo "- **Release URL:** ${{ steps.release.outputs.release_url }}" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Changelog" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.changelog_check.outputs.has_unreleased_content }}" == "true" ]; then
            echo "✅ Unreleased changelog processed and reset." >> $GITHUB_STEP_SUMMARY
          else
            echo "ℹ️ No unreleased changelog content detected." >> $GITHUB_STEP_SUMMARY
          fi
        else
          echo "- Release script did not run (skipped or failed before execution)." >> $GITHUB_STEP_SUMMARY
        fi
        if [ "${{ steps.desktop_artifacts.outputs.published }}" == "true" ]; then
          echo "- **Publication:** Release v3 completed with desktop artifacts" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ steps.desktop_artifacts.outputs.dispatched }}" == "true" ]; then
          echo "- **Publication:** Release v3 run ${{ steps.desktop_artifacts.outputs.run_id }} failed or could not be tracked" >> $GITHUB_STEP_SUMMARY
        fi
    
