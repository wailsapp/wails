name: Auto Labeler

on:
  issues:
    types: [opened, edited, reopened]
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:
    inputs:
      number:
        description: "Optional issue or pull request number; blank scans all unversioned issues"
        required: false
        type: string
      dry_run:
        description: "Preview API work without changing labels"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  classify:
    name: Classify version and type
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply shared issue classifier
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ITEM_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.number }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--default-version v3)
          if [[ -n "$ITEM_NUMBER" ]]; then
            args+=(--number "$ITEM_NUMBER")
          fi
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          ./scripts/label-github-items.sh "${args[@]}"

  issue-labeler:
    name: Label issues
    if: github.event_name == 'issues'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: github/issue-labeler@v3.4
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/issue-labeler.yml
          enable-versioned-regex: 0
          include-title: 1

  pr-labeler:
    name: Label pull requests
    if: github.event_name == 'pull_request_target'
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/file-labeler.yml
          sync-labels: false
