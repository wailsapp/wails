name: Changelog publication tests

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to test
        required: true
        type: string
  pull_request:
    paths:
      - 'v3/scripts/*changelog*.go'
      - 'v3/tasks/changelog/**'
      - 'v3/tasks/releaseci/**'
      - 'v3/go.mod'
      - 'v3/go.sum'
      - 'v3/tasks/release/**'
      - 'v3/UNRELEASED_CHANGELOG.md'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Reject the retired shared changelog file
        run: |
          if git ls-files --error-unmatch v3/UNRELEASED_CHANGELOG.md >/dev/null 2>&1; then
            echo '::error::DO NOT recreate v3/UNRELEASED_CHANGELOG.md. Release notes come from merged PRs.'
            exit 1
          fi
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27'
          cache-dependency-path: v3/go.sum
      - name: Test release-note generation and archive synchronization
        run: go -C v3 test -race ./tasks/changelog
      - name: Test CI scope, release gating, and competing pushes
        run: go -C v3 test -race ./tasks/releaseci
