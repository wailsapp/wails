name: Changelog publication tests

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to test
        required: true
        type: string
  pull_request:
    paths:
      - 'v3/scripts/*changelog*.py'
      - 'v3/tasks/release/**'
      - 'v3/UNRELEASED_CHANGELOG.md'
      - '.github/workflows/**'
      - '.github/scripts/test_release_ci.py'

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Reject the retired shared changelog file
        run: |
          if git ls-files --error-unmatch v3/UNRELEASED_CHANGELOG.md >/dev/null 2>&1; then
            echo '::error::DO NOT recreate v3/UNRELEASED_CHANGELOG.md. Release notes come from merged PRs.'
            exit 1
          fi
      - name: Test release-note generation and archive synchronization
        run: python3 -m unittest discover -s v3/scripts -p 'test_*changelog*.py'
      - name: Install workflow test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-test-venv"
          "$RUNNER_TEMP/ci-test-venv/bin/pip" install PyYAML==6.0.3
      - name: Test CI scope, release gating, and competing pushes
        run: |
          "$RUNNER_TEMP/ci-test-venv/bin/python" .github/scripts/test_release_ci.py
