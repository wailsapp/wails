name: Changelog publication tests

on:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to test
        required: true
        type: string
  pull_request:
    paths:
      - 'v3/scripts/*changelog*.py'
      - '.github/workflows/**'
      - '.github/scripts/test_release_ci.py'

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Test competing pushes and release evidence
        run: python3 -m unittest discover -s v3/scripts -p 'test_*changelog*.py'
      - name: Install workflow test dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/ci-test-venv"
          "$RUNNER_TEMP/ci-test-venv/bin/pip" install PyYAML==6.0.3
      - name: Test CI scope, release gating, and competing pushes
        run: "$RUNNER_TEMP/ci-test-venv/bin/python" .github/scripts/test_release_ci.py
