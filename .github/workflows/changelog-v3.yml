name: Changelog Validation (v3)

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'docs/mpress/content/changelog.md'
  # No workflow_dispatch trigger: a manual run executes in the default
  # branch's context, and this job runs PR-controlled code (go test / go run
  # on the PR checkout), which could poison the default branch's caches. Use
  # "Re-run jobs" on the PR's check run to validate again.

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    if: github.repository == 'wailsapp/wails'
    env:
      GOWORK: "off"
    permissions:
      contents: read
    
    steps:
    - name: Checkout PR code
      uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha }}
        fetch-depth: 0
        persist-credentials: false
        
    - name: Select validation script
      run: |
        echo "Fetching the validation script from master branch..."
        git fetch origin master

        if git diff --quiet origin/master...HEAD -- v3/scripts/validate-changelog.go v3/scripts/validate-changelog_test.go; then
          git checkout origin/master -- v3/scripts/validate-changelog.go
        else
          echo "The PR updates the validator; retaining that version for focused tests."
        fi
        
        echo "Validation script fetched successfully:"
        ls -la v3/scripts/
        
    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.27'

    - name: Test validation script changes
      run: |
        if ! git diff --quiet origin/master...HEAD -- v3/scripts/validate-changelog.go v3/scripts/validate-changelog_test.go; then
          go test v3/scripts/validate-changelog.go v3/scripts/validate-changelog_test.go
        fi
        
    - name: Get PR information
      id: pr_info
      run: |
        echo "pr_number=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
        echo "base_ref=${{ github.event.pull_request.base.ref }}" >> $GITHUB_OUTPUT
        
    - name: Check changelog modifications
      id: changelog_check
      run: |
        echo "Checking PR #${{ steps.pr_info.outputs.pr_number }} for changelog changes"
        git fetch origin ${{ steps.pr_info.outputs.base_ref }}
        
        # Initial imports have no documentation baseline. Historical source preservation
        # is reviewed with the migration; later changes use this guard.
        if git cat-file -e origin/${{ steps.pr_info.outputs.base_ref }}:docs/mpress/content/changelog.md 2>/dev/null &&
           git diff --name-only origin/${{ steps.pr_info.outputs.base_ref }}..HEAD | grep -q "docs/mpress/content/changelog.md"; then
          echo "changelog_modified=true" >> $GITHUB_OUTPUT
          echo "✅ Changelog was modified in this PR"
        else
          echo "changelog_modified=false" >> $GITHUB_OUTPUT
          echo "ℹ️ Changelog was not modified - skipping validation"
        fi
        
    - name: Get changelog diff
      id: get_diff
      if: steps.changelog_check.outputs.changelog_modified == 'true'
      run: |
        echo "Getting diff for changelog changes..."
        git diff origin/${{ steps.pr_info.outputs.base_ref }}..HEAD docs/mpress/content/changelog.md > /tmp/pr_changelog.diff
        git show origin/${{ steps.pr_info.outputs.base_ref }}:docs/mpress/content/changelog.md > /tmp/base_changelog.md
        awk '/^\+\+\+/ { next } /^\+/ { sub(/^\+/, ""); print }' /tmp/pr_changelog.diff > /tmp/pr_added_lines.txt
        awk '/^---/ { next } /^-/ { sub(/^-/, ""); print }' /tmp/pr_changelog.diff > /tmp/pr_deleted_lines.txt
        
        echo "Lines added in this PR:"
        cat /tmp/pr_added_lines.txt
        echo "Total lines added: $(wc -l < /tmp/pr_added_lines.txt)"

        echo "Lines deleted in this PR:"
        cat /tmp/pr_deleted_lines.txt
        echo "Total lines deleted: $(wc -l < /tmp/pr_deleted_lines.txt)"
        
    - name: Validate changelog
      id: validate
      if: steps.changelog_check.outputs.changelog_modified == 'true'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        echo "Running changelog validation..."
        cp docs/mpress/content/changelog.md /tmp/changelog.md
        cd v3/scripts
        if ! OUTPUT=$(go run validate-changelog.go /tmp/changelog.md /tmp/pr_added_lines.txt /tmp/pr_deleted_lines.txt /tmp/base_changelog.md 2>&1); then
          echo "$OUTPUT"
          exit 1
        fi
        echo "$OUTPUT"
        
        RESULT=$(echo "$OUTPUT" | grep "VALIDATION_RESULT=" | cut -d'=' -f2)
        echo "result=$RESULT" >> $GITHUB_OUTPUT
        
    - name: Fail if validation failed
      if: steps.validate.outputs.result && steps.validate.outputs.result != 'success'
      run: |
        echo "❌ Changelog validation failed"
        exit 1
